namespace: system

traefik:
  defines: runnable
  variables:
    configs-dir:
      value: <- `${volume-path}/ingress`
      type: string
    http-port:
      value: 80
      type: int
    http-secure-port:
      value: 443
      type: int
    tls-cert:
      type: string
      value: ""
      # deprecated: single global cert/key pair, kept for backward compatibility.
      # The array-based "global-certs" plugin param (any number of domains) is
      # handled entirely daemon-side (ingress_config.go writes per-domain cert
      # files directly into the ingress config volume) — no template variable
      # or file needed for it here.
    tls-key:
      type: string
      value: ""
      # deprecated: see tls-cert.
  files:
    tls-cert:
      container: traefik
      path: /certs/tls.crt
      mode: 0644
      contents: <- $tls-cert default("")
    tls-key:
      container: traefik
      path: /certs/tls.key
      mode: 0600
      contents: <- $tls-key default("")
    node-cert:
      mode: 0644
      container: traefik
      path: /certs/node-tls.crt
      contents: <- ssl-certificate default("")
    node-key:
      mode: 0600
      container: traefik
      path: /certs/node-tls.key
      contents: <- ssl-private-key default("")
    traefik-config:
      container: traefik
      path: /etc/traefik/traefik.yml
      mode: 0644
      contents: |
        entryPoints:
          web:
            address: ":80"
            http:
              redirections:
                entryPoint:
                  to: websecure
                  scheme: https
                  permanent: true
          websecure:
            address: ":443"
            asDefault: true
            http:
              tls: {}
        providers:
          file:
            directory: /etc/traefik/dynamic
            watch: true
        log:
          level: INFO
  containers:
    traefik:
      image: traefik:v3.4.3
      paths:
        - <- `${configs-dir}:/etc/traefik/dynamic`
  services:
    web:
      container: traefik
      port: 80
      protocol: tcp
      host-port: <- $http-port
      publish: true
    websecure:
      container: traefik
      port: 443
      protocol: tcp
      host-port: <- $http-secure-port
      publish: true
  scale:
    value: metric("node-count")

traefik-waf:
  defines: runnable
  variables:
    waf-hostname:
      type: string
      value: <- service-hostname("system/waf", "waf")
    waf-port:
      type: string
      value: <- service-port("system/waf", "waf")
    configs-dir:
      value: <- `${volume-path}/ingress`
      type: string
    http-port:
      value: 80
      type: int
    http-secure-port:
      value: 443
      type: int
    tls-cert:
      type: string
      value: ""
      # deprecated: single global cert/key pair, kept for backward compatibility.
      # The array-based "global-certs" plugin param is handled entirely
      # daemon-side — no template variable or file needed for it here.
    tls-key:
      type: string
      value: ""
      # deprecated: see tls-cert.
  connections:
    waf-conn:
      runnable: system/waf
      service: waf
  files:
    tls-cert:
      container: traefik
      path: /certs/tls.crt
      mode: 0644
      contents: <- $tls-cert default("")
    tls-key:
      container: traefik
      path: /certs/tls.key
      mode: 0600
      contents: <- $tls-key default("")
    node-cert:
      mode: 0644
      container: traefik
      path: /certs/node-tls.crt
      contents: <- ssl-certificate default("")
    node-key:
      mode: 0600
      container: traefik
      path: /certs/node-tls.key
      contents: <- ssl-private-key default("")
    traefik-config:
      container: traefik
      path: /etc/traefik/traefik.yml
      mode: 0644
      contents: |
        entryPoints:
          web:
            address: ":80"
            http:
              redirections:
                entryPoint:
                  to: websecure
                  scheme: https
                  permanent: true
          websecure:
            address: ":443"
            asDefault: true
            http:
              tls: {}
        providers:
          file:
            directory: /etc/traefik/dynamic
            watch: true
        experimental:
          plugins:
            traefik-modsecurity-plugin:
              moduleName: github.com/madebymode/traefik-modsecurity-plugin
              version: v1.6.0
        log:
          level: INFO
  containers:
    traefik:
      image: traefik:v3.4.3
      paths:
        - <- `${configs-dir}:/etc/traefik/dynamic`
  services:
    web:
      container: traefik
      port: 80
      protocol: tcp
      host-port: <- $http-port
      publish: true
    websecure:
      container: traefik
      port: 443
      protocol: tcp
      host-port: <- $http-secure-port
      publish: true
  scale:
    value: metric("node-count")

waf:
  defines: runnable
  variables:
    dummy-hostname:
      type: string
      value: <- service-hostname("system/dummy", "dummy")
    dummy-port:
      type: string
      value: <- service-port("system/dummy", "dummy")
  containers:
    waf:
      image: owasp/modsecurity-crs:4.16.0-apache-alpine-202506301206
      environment:
        - PARANOIA=1
        - ANOMALY_INBOUND=10
        - ANOMALY_OUTBOUND=5
        - <- `BACKEND=http://${dummy-hostname}:${dummy-port}`
        # New in CRS 4
        - REPORTING_LEVEL=2

        #######################################################
        # ModSecurity ENV Variables
        #######################################################

        - MODSEC_AUDIT_LOG_FORMAT=JSON
        - MODSEC_RULE_ENGINE=On
  connections:
    dummy-conn:
      runnable: system/dummy
      service: dummy
  services:
    waf:
      container: waf
      port: 8080
      protocol: tcp

dummy:
  defines: runnable
  containers:
    dummy:
      image: traefik/whoami:v1.11
  services:
    dummy:
      container: dummy
      port: 80
      protocol: tcp

traefik-stack:
  defines: process-group
  runnable-list:
    - system/traefik-waf
    - system/waf
    - system/dummy
